# Runs the release images pinned to TRACIUM_VERSION; add `-f compose.build.yaml` to build from this checkout.
# `migrate` is idempotent and re-runs on every `up` before the app services start.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.6
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tracium
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tracium"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/antonij-simonovski/migrate:${TRACIUM_VERSION:-1.2.2}
    environment:
      CLICKHOUSE_HTTP: http://clickhouse:8123
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      POSTGRES_DSN: postgres://tracium:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tracium?sslmode=disable
      # Span retention in days; 0 keeps data forever (no TTL). See .env.
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      # Required only when upgrading telemetry written before workspace scoping.
      LEGACY_WORKSPACE_ID: ${LEGACY_WORKSPACE_ID:-}
      LEGACY_INGESTION_PAUSED: ${LEGACY_INGESTION_PAUSED:-false}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

  # Queue volumes created by older root images are root-owned; the collector runs as 10001.
  collector-queue-owner:
    image: alpine:3.24
    user: root
    command: ["chown", "-R", "10001:10001", "/var/lib/tracium/queue"]
    volumes:
      - collector_queue:/var/lib/tracium/queue
    restart: "no"

  collector:
    image: ghcr.io/antonij-simonovski/collector:${TRACIUM_VERSION:-1.2.2}
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:13133:8080"  # Health (health_check extension)
    environment:
      CLICKHOUSE_DSN: clickhouse://default:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}@clickhouse:9000/tracium
      PRICING_STATIC_PATH: /etc/tracium/pricing.json
      CAPTURE_CONTENT: ${CAPTURE_CONTENT:-true}
      INGEST_VERIFY_URL: http://api:8090/v1/ingest/keys/verify
    volumes:
      - ./spec/pricing/pricing.json:/etc/tracium/pricing.json:ro
      # Must persist: holds spans already acknowledged to clients during a ClickHouse outage.
      - collector_queue:/var/lib/tracium/queue
    depends_on:
      migrate:
        condition: service_completed_successfully
      collector-queue-owner:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  api:
    image: ghcr.io/antonij-simonovski/api:${TRACIUM_VERSION:-1.2.2}
    ports:
      - "127.0.0.1:8090:8090"   # REST API
    environment:
      CLICKHOUSE_DSN: clickhouse://default:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}@clickhouse:9000/tracium
      POSTGRES_DSN: postgres://tracium:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tracium?sslmode=disable
      # No default: a secret shared by every install would let anyone mint tokens.
      JWT_SECRET: "${JWT_SECRET:?required — add JWT_SECRET to .env, generate one with 'openssl rand -hex 32'}"
      LISTEN_ADDR: ":8090"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      # Resolve only the dashboard containers, not the whole Docker subnet.
      AUTH_TRUSTED_PROXIES: dns:dashboard
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    image: ghcr.io/antonij-simonovski/dashboard:${TRACIUM_VERSION:-1.2.2}
    ports:
      - "127.0.0.1:3000:3000"   # Dashboard UI
    depends_on:
      - api
    restart: unless-stopped

volumes:
  clickhouse_data:
  postgres_data:
  collector_queue:
