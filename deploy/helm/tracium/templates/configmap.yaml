apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracium.fullname" . }}-config
  labels:
    {{- include "tracium.labels" . | nindent 4 }}
data:
  # OpenTelemetry Collector format — the collector is a generic OTel Collector
  # plus the tracium processor and clickhousespan exporter. Keep this in sync
  # with collector/config/collector.yaml (the compose deployment mounts
  # that file directly; this block is its Helm-templated twin).
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.collector.service.grpcPort }}
            # Ingest requires a per-workspace API key (traciumauth, below). Not
            # optional — unknown or revoked keys are rejected with 401.
            auth: { authenticator: traciumauth }
          http:
            endpoint: 0.0.0.0:{{ .Values.collector.service.httpPort }}
            auth: { authenticator: traciumauth }

    processors:
      tracium:
        pricing:
          source: static
          static_file_path: /etc/tracium/pricing.json
        user:
          source: passthrough
        capture_content: {{ .Values.collector.captureContent }}
        # Count rejected spans per workspace for the dashboard's setup checks.
        dead_letter:
          clickhouse_dsn: ${env:CLICKHOUSE_DSN}

      # No standalone `batch` processor: it would sit BEFORE the durable queue
      # and ACK spans to the client before they are persisted, so a crash or a
      # full queue loses acknowledged spans. Batching is done by the exporter
      # after the queue (see clickhousespan.batcher below).

    exporters:
      clickhousespan:
        dsn: ${env:CLICKHOUSE_DSN}
        sending_queue:
          # Durable queue on the per-pod PVC (see collector-statefulset.yaml).
          # Without it a pod replacement during a ClickHouse outage destroys
          # spans already ACKed to the client.
          storage: file_storage
          # In batches: 200 x 5000 spans x ~2KB = ~2GB ceiling, on disk.
          queue_size: 200
        retry_on_failure:
          enabled: true
          # Retry indefinitely — safe only because the queue is durable and
          # bounded. The upstream 5m default drops batches across any longer
          # outage (a ClickHouse upgrade routinely exceeds it).
          max_elapsed_time: 0
        batcher:
          # Batches on the way OUT of the durable queue, so it never sits between
          # the receiver and durability. Flush at 5k spans or 5s; split over 10k.
          enabled: true
          flush_timeout: 5s
          min_size_items: 5000
          max_size_items: 10000

    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.collector.service.healthPort }}
      file_storage:
        directory: /var/lib/tracium/queue
        compaction:
          on_start: true
          directory: /var/lib/tracium/queue
      # REQUIRED ingest authentication. Every OTLP request must carry a Tracium
      # API key; the authenticator verifies it against the API (which owns the
      # key store) and the key decides the workspace. INGEST_VERIFY_URL is set on
      # the collector StatefulSet to the in-cluster API service.
      traciumauth:
        endpoint: ${env:INGEST_VERIFY_URL}
        cache_ttl: 60s
        cache_max_entries: 10000
        # Per-sender cap on verify calls forced against the API per window (only
        # cache misses count), so one abusive sender streaming invalid keys can't
        # spend the collector's shared verify budget. <= 0 disables.
        sender_verify_limit: 20
        sender_verify_window: 1m

    service:
      # traciumauth is required: without it the receivers have no authenticator
      # and the tracium processor rejects every keyless span.
      extensions: [health_check, file_storage, traciumauth]
      telemetry:
        metrics:
          # All interfaces, so the span-drop counters are scrapable in-cluster.
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [tracium]
          exporters: [clickhousespan]
        metrics:
          receivers: [otlp]
          processors: [tracium]
          exporters: [clickhousespan]

  api.yaml: |
    server:
      addr: "0.0.0.0:{{ .Values.api.service.port }}"
      read_timeout_seconds: 30
      write_timeout_seconds: 30

    storage:
      clickhouse_dsn: "${CLICKHOUSE_DSN}"

    auth:
      # jwt verifies tokens against the Postgres accounts (the default). Set to
      # "none" only for local dev — it grants every request the admin role.
      mode: "jwt"
      # Register/login attempts per client IP per minute (default 10; negative
      # disables). Override per-pod with AUTH_RATE_LIMIT_PER_MINUTE.
      rate_limit_per_minute: 10
      # Ingest-key verification attempts per client IP per minute, on their own
      # bucket (not shared with login). The caller is a collector — one IP,
      # machine traffic — so it gets a larger, dedicated allowance; sharing
      # login's bucket let a few invalid keys block verification of good keys.
      # Default 120; negative disables. Override with AUTH_VERIFY_RATE_LIMIT_PER_MINUTE.
      verify_rate_limit_per_minute: 120
      # Trust the dashboard pod addresses, plus explicitly configured ingress
      # peers. Each proxy must sanitize X-Forwarded-For. dns: names must resolve
      # to actual peers (headless Services), not virtual ClusterIP addresses.
      {{- if and .Values.ingress.enabled (empty .Values.ingress.trustedProxies) }}
      {{- fail "ingress.trustedProxies must identify the ingress controller IPs, CIDRs, or dns:headless-service that sets X-Forwarded-For" }}
      {{- end }}
      trusted_proxies:
        - {{ printf "dns:%s-dashboard-peers.%s.svc" (include "tracium.fullname" .) .Release.Namespace | quote }}
        {{- range .Values.ingress.trustedProxies }}
        - {{ . | quote }}
        {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracium.fullname" . }}-pricing
  labels:
    {{- include "tracium.labels" . | nindent 4 }}
data:
  # Copied from spec/pricing/pricing.json by `make sync-generated`.
  pricing.json: |
{{ .Files.Get "files/pricing/pricing.json" | indent 4 }}
