apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tracium.fullname" . }}-postgres
  labels:
    {{- include "tracium.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "tracium.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          # New volumes keep data in a subdirectory, since a block volume's root
          # holds lost+found; volumes already initialized at the root stay there.
          command:
            - sh
            - -c
            - |
              if [ -s /var/lib/postgresql/data/PG_VERSION ]; then
                export PGDATA=/var/lib/postgresql/data
              else
                export PGDATA=/var/lib/postgresql/data/pgdata
              fi
              exec docker-entrypoint.sh postgres
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: tracium
            - name: POSTGRES_DB
              value: tracium
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.existingSecretKey }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tracium"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tracium"]
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize | default "10Gi" }}
