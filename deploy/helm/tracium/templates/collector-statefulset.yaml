# A StatefulSet so each replica's durable exporter queue survives pod replacement.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tracium.fullname" . }}-collector
  labels:
    {{- include "tracium.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: {{ .Values.collector.replicaCount }}
  serviceName: {{ include "tracium.fullname" . }}-collector
  # Parallel keeps scale-up/down behaving like the Deployment this replaced;
  # the ordered default only matters for clustered stores, which this is not.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: collector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.collector.podSecurityContext | nindent 8 }}
      containers:
        - name: collector
          image: "{{ .Values.collector.image.repository }}:{{ include "tracium.imageTag" (dict "component" .Values.collector "global" .Values.global "chart" .Chart) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc-otlp
              containerPort: {{ .Values.collector.service.grpcPort }}
              protocol: TCP
            - name: http-otlp
              containerPort: {{ .Values.collector.service.httpPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.collector.service.healthPort }}
              protocol: TCP
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.existingSecret }}
                  key: {{ .Values.clickhouse.existingSecretKey }}
            - name: CLICKHOUSE_DSN
              value: {{ include "tracium.clickhouseDSN" . | quote }}
            - name: INGEST_VERIFY_URL
              value: "http://{{ include "tracium.fullname" . }}-api:{{ .Values.api.service.port }}/v1/ingest/keys/verify"
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            {{- toYaml .Values.collector.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tracium/collector.yaml
              subPath: collector.yaml
              readOnly: true
            - name: pricing
              mountPath: /etc/tracium/pricing.json
              subPath: pricing.json
              readOnly: true
            - name: queue
              mountPath: /var/lib/tracium/queue
      volumes:
        - name: config
          configMap:
            name: {{ include "tracium.fullname" . }}-config
        - name: pricing
          configMap:
            name: {{ include "tracium.fullname" . }}-pricing
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.collector.queue.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.collector.queue.storageSize | default "5Gi" }}
