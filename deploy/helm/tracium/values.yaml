global:
  # Empty tracks the chart's appVersion, so a released chart requests the images
  # built for that release. Per-component image.tag overrides it.
  imageTag: ""
  imagePullPolicy: IfNotPresent

collector:
  replicaCount: 2
  image:
    repository: ghcr.io/antonij-simonovski/collector
    tag: ""
  captureContent: true
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  service:
    grpcPort: 4317
    httpPort: 4318
    healthPort: 8080
  podSecurityContext:
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  # Per-pod volume for the durable exporter queue, which holds acknowledged spans
  # while ClickHouse is unreachable. It is capped at queue_size batches
  # (200 x 5000 spans x ~2KB = ~2GB); content capture makes spans larger.
  queue:
    storageSize: "5Gi"
    storageClass: ""

api:
  replicaCount: 2
  image:
    repository: ghcr.io/antonij-simonovski/api
    tag: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    port: 8090
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  # Required: create a unique secret per install before `helm install`:
  #   kubectl create secret generic tracium-api-jwt \
  #     --from-literal=jwt-secret=$(openssl rand -hex 32)
  jwt:
    existingSecret: "tracium-api-jwt"
    existingSecretKey: "jwt-secret"

dashboard:
  replicaCount: 1
  image:
    repository: ghcr.io/antonij-simonovski/dashboard
    tag: ""
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  service:
    port: 3000
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false

migrate:
  # Legacy upgrade only: select an existing workspace and stop ingestion first.
  # See deploy/docs/upgrading.md. Empty on a fresh installation.
  legacyWorkspaceId: ""
  legacyIngestionPaused: false
  image:
    repository: ghcr.io/antonij-simonovski/migrate
    tag: ""
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

retention:
  # Span TTL in days; 0 keeps data forever. Applied when the spans table is
  # created; changing it later needs an ALTER (see 001_create_spans.sql).
  days: 90

clickhouse:
  # Empty uses the cluster's default StorageClass.
  storageClass: "standard"
  storageSize: "50Gi"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  # Create before installing:
  #   kubectl create secret generic tracium-clickhouse-secret --from-literal=password=<value>
  existingSecret: "tracium-clickhouse-secret"
  existingSecretKey: "password"

postgres:
  # Empty uses the cluster's default StorageClass.
  storageClass: "standard"
  storageSize: "10Gi"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  # Create before installing:
  #   kubectl create secret generic tracium-postgres-secret --from-literal=password=<value>
  existingSecret: "tracium-postgres-secret"
  existingSecretKey: "password"

ingress:
  enabled: false
  # Required when enabled: ingress controller peer IPs/CIDRs, or a
  # dns:headless-service name resolving to controller pod addresses. The
  # controller must sanitize X-Forwarded-For. Do not trust the whole cluster.
  trustedProxies: []
  host: "tracium.example.com"
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  tls:
    enabled: false
    secretName: "tracium-tls"
