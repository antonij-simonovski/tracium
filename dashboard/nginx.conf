server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # The browser uses the same origin; only nginx needs the internal API host.
    location /v1/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (do NOT append) X-Forwarded-For with the connection's real
        # peer as observed by nginx. Using $proxy_add_x_forwarded_for would keep
        # any client-supplied value as the left-most entry, letting a caller spoof
        # its source IP and evade the API's per-IP auth rate limiter. The API is
        # configured to trust this proxy (AUTH_TRUSTED_PROXIES) and reads the
        # value nginx sets here.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # MCP connector URLs carry a read key in the path; keep it out of the access log.
    location /v1/mcp/ {
        access_log off;
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA entry point must never be cached: it references the content-hashed
    # asset filenames, so a stale index.html pins the browser to an old bundle
    # after a deploy. no-cache forces revalidation on every load (a 304 when
    # unchanged), so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets — their filenames are content-hashed, so a new build
    # yields new names and these can be cached immutably for a year.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
