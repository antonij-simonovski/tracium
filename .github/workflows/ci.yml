name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter calls the PR listFiles API

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.f.outputs.go }}
      dashboard: ${{ steps.f.outputs.dashboard }}
      spec: ${{ steps.f.outputs.spec }}
      helm: ${{ steps.f.outputs.helm }}
      infra: ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            go: ['collector/**', 'api/**', 'go.work']
            dashboard: ['dashboard/**']
            spec: ['spec/**']
            helm: ['deploy/**']
            infra: ['docker-compose.yml', 'compose.*.yaml', 'Makefile', '.github/workflows/**', 'examples/**']

  go-test:
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: core_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.6
        env:
          CLICKHOUSE_PASSWORD: test-password
        ports: ['8123:8123', '9000:9000']
        options: --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_POSTGRES_DSN: postgres://postgres:test-password@localhost:5432/core_test?sslmode=disable
      TEST_CLICKHOUSE_DSN: clickhouse://default:test-password@localhost:9000/tracium
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.spec == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l api collector)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Migrate the ClickHouse schema
        env:
          CLICKHOUSE_HTTP: http://localhost:8123
          CLICKHOUSE_PASSWORD: test-password
          POSTGRES_DSN: ${{ env.TEST_POSTGRES_DSN }}
          MIGRATIONS_DIR: collector/schema
        run: bash deploy/docker/migrate/run-migrations.sh
      - name: Test every Go module
        run: |
          set -e
          for mod in $(find collector api -name go.mod -not -path '*/_build/*'); do
            dir=$(dirname "$mod")
            echo "::group::go test $dir"
            (cd "$dir" && go test ./...)
            echo "::endgroup::"
          done

  dashboard:
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.spec == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit
      - run: npm run build   # tsc typecheck + vite build
      - run: npm test
      - run: npm run build:library

  # The pinned TypeScript generator makes contract drift a release-blocking error.
  codegen-sync:
    needs: changes
    if: ${{ needs.changes.outputs.spec == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bash spec/codegen/gen-ts-types.sh
      - name: Fail if generated types are stale
        run: git diff --exit-code -- dashboard/src/types

  helm-lint:
    needs: changes
    if: ${{ needs.changes.outputs.helm == 'true' || needs.changes.outputs.spec == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: make helm-lint

  smoke:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.helm == 'true' || needs.changes.outputs.spec == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build and exercise a fresh isolated stack
        run: bash deploy/tests/smoke.sh
