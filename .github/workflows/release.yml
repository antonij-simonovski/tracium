name: Release
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: core_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://postgres:test-password@localhost:5432/core_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: azure/setup-helm@v5
      - run: make test
      - run: npm --prefix dashboard run build
      - run: npm --prefix dashboard run build:library
      - run: bash spec/codegen/gen-ts-types.sh
      - run: git diff --exit-code -- dashboard/src/types
      - run: make helm-lint
      - run: make smoke

  images:
    needs: validate
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - { name: collector, context: collector }
          - { name: api,        context: api }
          - { name: dashboard,  context: dashboard }
          - { name: migrate,    context: ., file: deploy/docker/migrate/Dockerfile }
        # Each platform builds on a runner of its own architecture; emulating arm64 is several times slower.
        target:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.target.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.target.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.target.arch }}
      - name: Record the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  manifests:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        name: [collector, api, dashboard, migrate]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Must match the chart's appVersion, which is the tag without the leading v.
      - name: Tag the multi-platform image (version = tag without the leading v)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
        run: |
          tags=(-t "$IMAGE:${GITHUB_REF_NAME#v}")
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"

  chart:
    needs: manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package the Helm chart (version = tag without the leading v)
        run: |
          make sync-generated
          V="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/tracium --version "$V" --app-version "$V"
      - uses: softprops/action-gh-release@v3
        with:
          files: tracium-*.tgz
