openapi: "3.1.0"

info:
  title: Tracium API
  version: 1.0.4
  description: >
    REST API for querying traces and spans collected by the Tracium
    OpenTelemetry-native LLM observability platform. All timestamps are
    Unix epoch milliseconds. All monetary values are USD.

servers:
  - url: "http://localhost:8090"
    description: Local development server

security:
  - bearerAuth: []

paths:
  /v1/traces:
    get:
      operationId: listTraces
      summary: List traces
      description: >
        Returns a paginated list of traces, scoped to the workspaces the caller
        is a member of (see workspace_id). Results are ordered by start_time_ms
        descending.
      tags:
        - Traces
      parameters:
        - name: user_id
          in: query
          description: Optional filter by end-client / user id (a metering label, not an access boundary).
          schema:
            type: string
        - $ref: "#/components/parameters/WorkspaceFilter"
        - name: model
          in: query
          description: Filter traces that contain at least one span using this model (normalized model id).
          schema:
            type: string
        - name: workflow
          in: query
          description: Filter to traces belonging to a single workflow (the trace root name), which powers a workflow's recent runs.
          schema:
            type: string
        - name: version
          in: query
          description: Filter to traces that ran under this workflow version (see Trace.workflow_version).
          schema:
            type: string
        - name: has_error
          in: query
          description: Filter to traces that have at least one error span.
          schema:
            type: boolean
        - name: start_after
          in: query
          description: Return traces whose start_time_ms is after this ISO 8601 date-time.
          schema:
            type: string
            format: date-time
        - name: start_before
          in: query
          description: Return traces whose start_time_ms is before this ISO 8601 date-time.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Page number (1-based).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of results per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Paginated list of traces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTraceResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/traces/{id}:
    get:
      operationId: getTrace
      summary: Get a trace by ID
      description: Returns a trace and spans from the caller's allowed workspaces. A known trace ID never bypasses workspace membership.
      tags:
        - Traces
      parameters:
        - $ref: "#/components/parameters/WorkspaceFilter"
        - name: id
          in: path
          required: true
          description: The trace_id of the trace to retrieve.
          schema:
            type: string
      responses:
        "200":
          description: The requested trace with all spans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceDetail"
        "403":
          description: The requested workspace is inaccessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trace not found in the caller's workspace scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/traces/{traceId}/spans:
    get:
      operationId: listSpans
      summary: List spans in an accessible trace
      description: Returns only spans within the caller's workspace scope. A missing or inaccessible trace returns 404.
      tags: [Traces]
      parameters:
        - $ref: "#/components/parameters/WorkspaceFilter"
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Spans from accessible workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSpanResponse"
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The requested workspace is inaccessible.
        "404":
          description: No accessible spans for that trace ID.
        "500":
          description: Internal error or incompatible span schema.

  /v1/metrics/kpis:
    get:
      operationId: getOverviewKpis
      summary: Overview KPIs
      description: >
        Returns the four headline metrics (total cost, workflow runs, p95 latency,
        error rate) for the selected range, each with its change versus the
        equal-length preceding period.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: The overview KPI set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiSet"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/cost-series:
    get:
      operationId: getCostSeries
      summary: Cost over time
      description: Total cost per time bucket across the range.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
        - $ref: "#/components/parameters/WorkflowFilter"
        - $ref: "#/components/parameters/VersionFilter"
      responses:
        "200":
          description: Cost buckets ordered by bucket_ms ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCostBucketResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/latency-series:
    get:
      operationId: getLatencySeries
      summary: Latency over time
      description: p50/p95/p99 of span duration (ms) per time bucket across the range.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
        - $ref: "#/components/parameters/WorkflowFilter"
        - $ref: "#/components/parameters/VersionFilter"
      responses:
        "200":
          description: Latency buckets ordered by bucket_ms ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLatencyBucketResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/error-series:
    get:
      operationId: getErrorSeries
      summary: Failures over time
      description: Failed-vs-total run counts per time bucket across the range, for the "Failures by day" strip.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
        - $ref: "#/components/parameters/WorkflowFilter"
        - $ref: "#/components/parameters/VersionFilter"
      responses:
        "200":
          description: Error buckets ordered by bucket_ms ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedErrorBucketResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/token-series:
    get:
      operationId: getTokenSeries
      summary: Tokens over time
      description: >
        Input and output tokens per time bucket across the range. Counted from
        per-call spans, the same source as the model-costs token totals, so the
        buckets sum to those totals.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
        - $ref: "#/components/parameters/WorkflowFilter"
        - $ref: "#/components/parameters/VersionFilter"
      responses:
        "200":
          description: Token buckets ordered by bucket_ms ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTokenBucketResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/top-workflows:
    get:
      operationId: getTopWorkflows
      summary: Top workflows by cost
      description: The highest-spending workflows (trace root names) in the range, ordered by cost descending.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: Workflows ordered by cost descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkflowCostResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/workflows:
    get:
      operationId: listWorkflows
      summary: Workflow activity list
      description: >
        Every active workflow in the range with its run count, total spend, mean
        run latency, error rate, and call-count sparkline, the data behind the
        Workflows page. Ordered by call count descending; sorting and filtering are
        done client-side. avg_latency_ms is 0 for long windows served from the
        daily rollup, where per-trace durations are not retained.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: Workflows ordered by call count descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkflowResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/workflows/{name}:
    get:
      operationId: getWorkflowDetail
      summary: Workflow detail
      description: >
        One workflow's detail-page payload: its headline metrics over the range
        plus the version and tool surface of its most recent run. Span-backed
        only; there is no workflow-config store, so runtime params (temperature,
        retries, owner, …) are not served. A raw-window feature: ranges longer
        than 30d (90d, 1y) are rejected with a 400, since per-workflow latency
        cannot be derived from the daily rollup.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/WorkflowName"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: The workflow's detail payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDetail"
        "400":
          description: Invalid range, or a range longer than 30d.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No workflow with that name has runs in the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/workflows/{name}/versions:
    get:
      operationId: listWorkflowVersions
      summary: Workflow versions
      description: >
        The versions of one workflow that ran in the range, with each version's
        runs, cost, latency, error rate and token use, most recently seen first.
        Runs without a version are listed as version "". Ranges up to 30d read
        each run's version per trace; longer ranges read the daily rollup, which
        keys versions per span and has no latency (p95_latency_ms is null). The two agree when the
        version is set on every span, e.g. as a resource attribute.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/WorkflowName"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: Versions ordered by last_seen_ms descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkflowVersionResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/failures:
    get:
      operationId: getFailures
      summary: Recent failures
      description: >
        The workflows with the most errored runs in the range. The response total
        counts every failed run in the window, not just the listed workflows.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: Failed workflows ordered by failure count descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedFailureResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/anomalies:
    get:
      operationId: getAnomalies
      summary: Statistical anomalies
      description: >
        Buckets that deviated significantly from their own recent history, for
        cost, error rate, and run volume, workspace-wide and per busy workflow.
        Detection is daily and robust (median + MAD over a trailing 28-day
        baseline), served entirely from the daily rollup, so a range of 7d or
        longer is required (24h is rejected with a 400). Results are ordered most
        severe first.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
        - name: metric
          in: query
          description: Restrict to one metric. Omitted, all three are detected.
          schema:
            type: string
            enum: ["cost", "error_rate", "runs"]
        - name: min_severity
          in: query
          description: Drop anomalies below this severity. Omitted, all severities are returned.
          schema:
            type: string
            enum: ["info", "warning", "critical"]
      responses:
        "200":
          description: Anomalies ordered by severity, then score, then recency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAnomalyResponse"
        "400":
          description: Invalid range, metric, or severity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/setup-checks:
    get:
      operationId: getSetupChecks
      summary: Instrumentation setup checks
      description: >
        Ways the workspace's instrumentation is sending telemetry Tracium cannot
        fully use, found in the range's spans and in the spans the collector
        rejected at ingest, with how to fix each. Checks that affected no span
        are omitted. Results are ordered most severe first, then by spans
        affected. Reads raw spans, so ranges longer than 30d are rejected.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: Setup checks that found a problem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSetupCheckResponse"
        "400":
          description: Invalid range, or one longer than 30d.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/model-costs:
    get:
      operationId: getModelCosts
      summary: Cost by model
      description: >
        Spend broken down by model over the range, the usage page's
        "where it goes" list. Each entry carries the model's cost, run
        (trace) count, and summed input/output tokens, ordered by cost
        descending.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: Models ordered by cost descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedModelCostResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/usage-users:
    get:
      operationId: getUserUsage
      summary: Usage by user
      description: >
        Spend and run counts grouped by the end-client/metering user
        (`user.id`) over the range, each paired with the equal-length
        preceding window for period-over-period change, plus a per-row
        cost sparkline. Ordered by cost descending.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: Users ordered by cost descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUserUsageResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/usage-workflows:
    get:
      operationId: getWorkflowUsage
      summary: Usage by workflow
      description: >
        Spend and run counts grouped by workflow over the range, each paired
        with the preceding window for change, plus the workflow's most-used
        model. Ordered by cost descending.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: Workflows ordered by cost descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkflowUsageResponse"
        "400":
          description: Invalid range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/attribute-keys:
    get:
      operationId: getAttributeKeys
      summary: Custom-attribute dimensions
      description: >
        The custom-attribute keys present on spans in the window (e.g.
        `team`, `environment`, `customer`), offered as the allocation axes
        for /v1/metrics/usage-by-attribute. Reads raw spans, so ranges longer
        than 30d are rejected.
      tags:
        - Metrics
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: Available attribute keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAttributeKeyResponse"
        "400":
          description: Invalid range, or one longer than 30d.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/metrics/usage-by-attribute:
    get:
      operationId: getUsageByAttribute
      summary: Cost allocation by attribute
      description: >
        Spend and usage allocated across the values of one custom attribute,
        the cost-allocation primitive that splits AI spend by whatever
        dimension the instrumentation tags spans with. The `key` query
        parameter names the dimension (from /v1/metrics/attribute-keys) and
        is required. Ordered by cost descending. Reads raw spans, so ranges
        longer than 30d are rejected.
      tags:
        - Metrics
      parameters:
        - name: key
          in: query
          required: true
          description: The custom-attribute key to group by (e.g. "team").
          schema:
            type: string
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/WorkspaceFilter"
      responses:
        "200":
          description: Attribute values ordered by cost descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAttributeUsageResponse"
        "400":
          description: Invalid range, a range longer than 30d, or the required `key` parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/health:
    get:
      operationId: healthCheck
      summary: Liveness check
      description: >
        Returns 200 when the API process is running. Does not verify
        downstream dependencies (use /v1/ready for that).
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: "ok"

  /v1/ready:
    get:
      operationId: readinessCheck
      summary: Readiness check
      description: >
        Returns 200 when the API is ready to serve traffic (database
        connections healthy). Returns 503 when not ready.
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: "ready"
        "503":
          description: Service is not ready (e.g. database unavailable).
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: "not_ready"

  /v1/auth/register:
    post:
      operationId: register
      summary: Register an account
      description: Creates an account and returns a bearer token. Unauthenticated.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; token returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "202":
          description: >
            Account created, but the deployment requires email confirmation
            before sign-in; no token is issued. The self-hosted build never
            returns this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationRequired"
        "409":
          description: An account with that email already exists (`EMAIL_TAKEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/login:
    post:
      operationId: login
      summary: Log in
      description: Exchanges email + password for a bearer token. Unauthenticated.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated; token returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          description: Invalid credentials (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            The account has not confirmed its email address (`EMAIL_UNVERIFIED`).
            Only returned by deployments that require confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the signed-in user's password
      description: >
        Verifies the current password and replaces it. Requires a login token.
        Every session issued before the change ends, including the caller's;
        the response carries the caller's new token. There is no email-based
        reset in the OSS build; operators reset a forgotten password with the
        API image's `reset-password` CLI, which also ends existing sessions.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed. Use the returned token from now on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "400":
          description: >
            Missing fields (`MISSING_FIELDS`) or a new password outside 8–72
            bytes (`INVALID_PASSWORD_FORMAT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >
            Missing or invalid bearer token, or the current password is
            incorrect (`INVALID_CURRENT_PASSWORD`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The account has no password (`NO_PASSWORD`), for example one an
            embedding application created for an external identity provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List the caller's workspaces
      description: >
        Every workspace the authenticated account is a member of, with the
        account's own role in each and the workspace's member count.
      tags: [Workspaces]
      responses:
        "200":
          description: The caller's workspaces.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      operationId: createWorkspace
      summary: Create a workspace
      description: Creates a workspace and makes the caller its owner member.
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: The created workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /v1/workspaces/{id}:
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: Deletes a workspace and all its memberships. Owner only.
      tags: [Workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "404":
          description: No such workspace owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{id}/members:
    get:
      operationId: listWorkspaceMembers
      summary: List members
      description: >
        Every account with access to the workspace, with its email and role,
        oldest first. Requires membership of the workspace.
      tags: [Workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The workspace's members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
        "403":
          description: The caller is not a member of the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addWorkspaceMember
      summary: Add a member
      description: >
        Grants another account access to the workspace, named by email. Owner
        only. The account joins as a `member`; ownership cannot be granted.
        The member can then read the workspace's telemetry. Consults the
        `workspaces.members.add` entitlement for the workspace; the default
        provider allows it.
      tags: [Workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberInput"
      responses:
        "204":
          description: >
            Member added, or already a member (idempotent, no seat check). An
            open invite for the account is closed by the add.
        "403":
          description: >
            `MEMBER_LIMIT_REACHED`: the workspace has reached its member limit.
            `FEATURE_UNAVAILABLE`: the entitlements provider denied
            `workspaces.members.add` (the account has an open invite) or
            `workspaces.invite` (it takes a new seat).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "`UNAVAILABLE`: the entitlements provider could not be reached."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace not owned by the caller, or no account with that email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{id}/members/{userId}:
    delete:
      operationId: removeWorkspaceMember
      summary: Remove a member
      description: Revokes an account's access. Owner only; the owner cannot be removed.
      tags: [Workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed.
        "400":
          description: Attempted to remove the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace not owned by the caller, or member not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{id}/invites:
    get:
      operationId: listWorkspaceInvites
      summary: List open invites
      description: >
        The workspace's open invites (not accepted, revoked, or expired), newest
        first. Link tokens are never returned here. Owner only.
      tags: [Workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The workspace's open invites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceInvite"
        "404":
          description: Workspace not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createWorkspaceInvite
      summary: Invite an email address
      description: >
        Invites an email address to join the workspace as a member, whether or
        not an account with that email exists yet. Returns a single-use link
        token exactly once; only its hash is stored. The owner shares the link
        with the invitee, who accepts it while signed in to that email (see
        acceptInvite). The invite expires after 7 days. Inviting an address that
        already has an open invite revokes the old one, so only the newest link
        works. Owner only. Consults the `workspaces.invite` entitlement for the
        workspace, except when replacing an open invite's link; the default
        provider allows it. When the deployment delivers
        invites itself (for example by email), `email_sent` is true; the link
        token is returned either way.
      tags: [Workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: The created invite, including the one-time link token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteCreated"
        "400":
          description: "`MISSING_FIELDS` or `INVALID_EMAIL`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            `MEMBER_LIMIT_REACHED`: the workspace has reached its member limit.
            `FEATURE_UNAVAILABLE`: the entitlements provider denied
            `workspaces.invite`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`ALREADY_MEMBER`: an account with that email already belongs to the workspace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The entitlements provider could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{id}/invites/{inviteId}:
    delete:
      operationId: revokeWorkspaceInvite
      summary: Revoke an invite
      description: Closes an open invite so its link stops working. Owner only.
      tags: [Workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked.
        "404":
          description: Workspace not owned by the caller, or no open invite with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/invites/{token}:
    get:
      operationId: previewInvite
      summary: Preview an invite
      description: >
        Describes the invite behind a link token so its holder can decide
        whether to join and which account to use. No session required; the
        endpoint shares the register/login per-IP rate limit.
      tags: [Workspaces]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: "`INVITE_NOT_FOUND`: no invite with that token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: "`INVITE_EXPIRED`: the invite was accepted, revoked, or has expired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/invites/{token}/accept:
    post:
      operationId: acceptInvite
      summary: Accept an invite
      description: >
        Adds the signed-in account to the invite's workspace as a member and
        closes the invite. The account's email must be the invited address.
        Consults the `workspaces.members.add` entitlement for the workspace
        before joining; the default provider allows it.
      tags: [Workspaces]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAccepted"
        "403":
          description: >
            `INVITE_EMAIL_MISMATCH`: the signed-in account is not the invited
            email. `MEMBER_LIMIT_REACHED`: the workspace has reached its member
            limit. `FEATURE_UNAVAILABLE`: the entitlements provider denied
            `workspaces.members.add`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`INVITE_NOT_FOUND`: no invite with that token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: "`INVITE_EXPIRED`: the invite was accepted, revoked, or has expired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{id}/api-keys:
    get:
      operationId: listApiKeys
      summary: List a workspace's ingest API keys
      description: >
        Every API key bound to the workspace, newest first, including revoked
        ones (so history is visible). The secret token itself is never returned
        here, only its non-secret prefix and metadata. Requires membership of
        the workspace.
      tags: [API Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The workspace's API keys (metadata only).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
        "403":
          description: The caller is not a member of the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createApiKey
      summary: Create an ingest API key
      description: >
        Issues a new key bound to this workspace for authenticating trace
        ingestion. The key both authenticates the sender and determines the
        workspace its telemetry lands in, so senders need not set a workspace
        attribute. The plaintext token is returned in this response exactly once
        and cannot be retrieved again, so capture it now. Only its hash is stored.
        Requires membership of the workspace; the caller is recorded as the key's
        creator, for provenance only.
      tags: [API Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyInput"
      responses:
        "201":
          description: The created key, including the one-time plaintext token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"
        "403":
          description: The caller is not a member of the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{id}/api-keys/{keyId}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an ingest API key
      description: >
        Disables a key in this workspace. Ingest requests presenting it are
        rejected thereafter (subject to the collector's short verification
        cache). The row is retained, marked revoked, for audit. Requires
        membership of the workspace.
      tags: [API Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked.
        "403":
          description: The caller is not a member of the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such active key in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ingest/keys/verify:
    post:
      operationId: verifyApiKey
      summary: Verify an ingest API key (collector-facing)
      description: >
        Resolves a presented ingest key to the workspace it grants. This endpoint
        is called by the collector's authenticator extension, not by end users, so
        it is unauthenticated (it carries no session) but rate-limited. It leaks
        no detail about why a key failed.
      tags: [API Keys]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyVerifyRequest"
      responses:
        "200":
          description: The key is valid; the workspace it grants is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyVerifyResponse"
        "400":
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The key is missing, malformed, unknown, or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body exceeds 4 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT or opaque bearer token issued by the Tracium auth service.

  parameters:
    WorkflowName:
      name: name
      in: path
      required: true
      description: The workflow name (the trace root span name).
      schema:
        type: string
    Range:
      name: range
      in: query
      description: >-
        Time window for the metric. Defaults to 7d. 24h is bucketed hourly;
        7d/30d/90d/1y daily. Ranges longer than 30d (90d, 1y) are served from the
        daily rollup, so latency percentiles are not available for them.
      schema:
        type: string
        enum: ["24h", "7d", "30d", "90d", "1y"]
        default: "7d"
    UserFilter:
      name: user_id
      in: query
      description: Optional business filter (the operator's end-client). Empty means all clients.
      schema:
        type: string
    WorkspaceFilter:
      name: workspace_id
      in: query
      description: >-
        Scope the read to one workspace. This is an access boundary, not just a
        filter: the caller must be a member of the workspace or the request is
        refused with 403. Omitted, the read covers every workspace the caller is
        a member of (an account that is a member of none sees nothing). The
        dashboard passes the active workspace from its switcher.
      schema:
        type: string
    WorkflowFilter:
      name: workflow
      in: query
      description: >-
        Optional: restrict the metric to a single workflow (the trace root name),
        powering the workflow detail page's charts. Only the series endpoints
        accept it; other metrics endpoints reject it with a 400. Workflow-scoped
        series are a raw-window feature; ranges longer than 30d (90d, 1y) are
        rejected with a 400, since per-workflow latency cannot be derived from the
        daily rollup.
      schema:
        type: string
    VersionFilter:
      name: version
      in: query
      description: >-
        Optional: restrict the metric to the runs of one workflow version (see
        Trace.workflow_version), alone or together with workflow. Accepted and
        limited to ranges up to 30d exactly like workflow.
      schema:
        type: string

  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          properties:
            extensions:
              type: object
              additionalProperties: true
              description: >
                Values from the dashboard's `signupFields` extension (for example
                a CAPTCHA response). The core API ignores them; an embedding
                application checks them itself.
    ConfirmationRequired:
      type: object
      required: [confirmation_required]
      properties:
        confirmation_required:
          type: boolean
          description: Always true; the account must confirm its email before signing in.
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: 8–72 bytes (bcrypt's input limit).
    Token:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: "Bearer token to send as the Authorization: Bearer header."
    Workspace:
      type: object
      required: [id, name, slug, env, role, members]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        env:
          type: string
          enum: [production, staging, development]
        role:
          type: string
          enum: [owner, member]
          description: The calling account's role in this workspace.
        members:
          type: integer
          minimum: 1
          description: Total number of accounts with access to this workspace.
    WorkspaceInput:
      type: object
      required: [name, slug, env]
      properties:
        name:
          type: string
        slug:
          type: string
        env:
          type: string
          enum: [production, staging, development]
    AddMemberInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: The account to grant access to.
    WorkspaceMember:
      type: object
      required: [user_id, email, role, joined_at]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, member]
        joined_at:
          type: string
          format: date-time
    InviteInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: The address to invite. Stored lowercased.
    WorkspaceInvite:
      type: object
      required: [id, workspace_id, email, role, invited_by, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [member]
        invited_by:
          type: string
          description: The id of the account that created the invite.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    WorkspaceInviteCreated:
      allOf:
        - $ref: "#/components/schemas/WorkspaceInvite"
        - type: object
          required: [token, email_sent]
          properties:
            email_sent:
              type: boolean
              description: >
                Whether the deployment delivered the invite to the invitee
                itself. False when no invite notifier is configured or delivery
                failed; the owner then shares the link by hand.
            token:
              type: string
              description: >
                The single-use link token (e.g. "trci_..."). Returned only here,
                only once; it is stored hashed. The dashboard's invite link is
                `/invite/<token>`.
    InvitePreview:
      type: object
      required: [workspace_name, invited_by_email, email, expires_at]
      properties:
        workspace_name:
          type: string
        invited_by_email:
          type: string
          description: The inviting account's email, or empty if it no longer exists.
        email:
          type: string
          format: email
          description: The invited address; accept while signed in to it.
        expires_at:
          type: string
          format: date-time
    InviteAccepted:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          description: The workspace the account just joined.
    APIKey:
      type: object
      required: [id, workspace_id, created_by, name, prefix, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          description: The workspace this key is bound to and ingests into.
        created_by:
          type: string
          description: >
            The account that created the key, for provenance only. It carries no
            authority; the key keeps working regardless of this account.
        name:
          type: string
          description: Human label for the key.
        prefix:
          type: string
          description: >
            Non-secret leading slice of the token (e.g. "trc_9f3a1b2c"), shown so
            the key is identifiable in the UI without revealing it.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the key was last accepted at ingest, or null if never.
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When the key was revoked, or null if still active.
    APIKeyInput:
      type: object
      properties:
        name:
          type: string
          description: Optional label; defaults to "default" when omitted.
    APIKeyCreated:
      type: object
      required: [key, token]
      properties:
        key:
          $ref: "#/components/schemas/APIKey"
        token:
          type: string
          description: >
            The plaintext ingest key (e.g. "trc_..."). Returned only here, only
            once; it is stored hashed and cannot be recovered later. Send it as
            "Authorization: Bearer <token>" on OTLP ingest.
    APIKeyVerifyRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: The plaintext ingest key to verify.
    APIKeyVerifyResponse:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          description: >
            The workspace the key grants. The collector stamps this onto every
            span the request carries, overriding any sender-supplied workspace;
            the key, not the payload, decides where data lands.
    Span:
      type: object
      required:
        - trace_id
        - span_id
        - name
      properties:
        trace_id:
          type: string
          description: Globally unique identifier for the trace this span belongs to.
        span_id:
          type: string
          description: Globally unique identifier for this span.
        parent_span_id:
          type: string
          description: span_id of the parent span, if this is a child span.
        name:
          type: string
          description: Human-readable name for this span.
        start_time_ms:
          type: integer
          description: Unix epoch milliseconds when the span started.
        end_time_ms:
          type: integer
          description: Unix epoch milliseconds when the span ended.
        duration_ms:
          type: integer
          description: Duration of the span in milliseconds.
        model:
          type: string
          description: The model name as reported in gen_ai.request.model.
        finish_reason:
          type: string
          description: Why the model stopped generating.
        input_tokens:
          type: integer
          minimum: 0
          description: Number of input tokens consumed.
        output_tokens:
          type: integer
          minimum: 0
          description: Number of output tokens generated.
        cost_usd:
          type: number
          minimum: 0
          description: Computed cost in USD for this span.
        user_id:
          type: string
          description: End-client / user identifier, the metering & cost-attribution label (not an access boundary).
        workspace_id:
          type: string
          description: Workspace the span belongs to, the access-control unit (accounts read only workspaces they are a member of).
        model_normalized:
          type: string
          description: Canonical model id after alias resolution.
        schema_version:
          type: integer
          minimum: 1
          description: Schema version of this span record.
        error_type:
          type: string
          description: "Added in schema v2. Short error class or type."
        error_message:
          type: string
          description: "Added in schema v2. Human-readable error message if the span failed."
        kind:
          type: string
          enum: ["agent", "llm", "tool", "chain", "retriever", "embedding"]
          description: >
            Normalized span role, derived by the collector from instrumentation
            attributes (OpenInference openinference.span.kind, Traceloop
            traceloop.span.kind, or the OTel GenAI gen_ai.operation.name).
            Optional: omitted when the collector could not classify the span,
            in which case consumers infer the role from the span's context.
        setup_issues:
          type: array
          items:
            $ref: "#/components/schemas/SetupIssue"
          description: >
            The span-level setup checks this span fails, such as a model the
            price table does not know. Omitted when it fails none.

    Trace:
      type: object
      required:
        - trace_id
      properties:
        trace_id:
          type: string
          description: Globally unique identifier for this trace.
        name:
          type: string
          description: Human-readable name for the trace.
        workflow_version:
          type: string
          description: >-
            The workflow version the trace ran under: the root span's version,
            else the earliest versioned span's. Empty when no span has one.
        start_time_ms:
          type: integer
          description: Unix epoch milliseconds when the trace started.
        end_time_ms:
          type: integer
          description: Unix epoch milliseconds when the trace ended.
        duration_ms:
          type: integer
          description: Total duration in milliseconds.
        user_id:
          type: string
          description: End-client / user identifier, the metering & cost-attribution label (not an access boundary).
        workspace_id:
          type: string
          description: Workspace the trace belongs to, the access-control unit.
        span_count:
          type: integer
          minimum: 0
          description: Total number of spans in this trace.
        has_error:
          type: boolean
          description: True if any span in this trace recorded an error.
        total_cost_usd:
          type: number
          minimum: 0
          description: Sum of cost_usd across all spans in this trace.
        schema_version:
          type: integer
          minimum: 1
          description: Schema version of this trace record.

    TraceDetail:
      allOf:
        - $ref: "#/components/schemas/Trace"
        - type: object
          required:
            - spans
          properties:
            spans:
              type: array
              description: All spans belonging to this trace, ordered by start_time_ms ascending.
              items:
                $ref: "#/components/schemas/Span"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "Machine-readable error code (e.g. NOT_FOUND, UNAUTHORIZED, INVALID_REQUEST)."
        message:
          type: string
          description: Human-readable description of the error.

    PaginatedSpanResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Span"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedTraceResponse:
      type: object
      required:
        - items
        - total
        - page
        - page_size
        - has_more
      properties:
        items:
          type: array
          description: The traces on this page.
          items:
            $ref: "#/components/schemas/Trace"
        total:
          type: integer
          minimum: 0
          description: Total number of matching traces across all pages.
        page:
          type: integer
          minimum: 1
          description: Current page number (1-based).
        page_size:
          type: integer
          minimum: 1
          description: Number of items per page.
        has_more:
          type: boolean
          description: True if there are more pages after this one.

    Kpi:
      type: object
      required:
        - value
        - delta
        - delta_type
      properties:
        value:
          type: number
          description: Raw metric value (USD, count, ms, or fraction depending on the KPI).
        delta:
          type: number
          description: Fractional change versus the preceding period (0.12 == +12%).
        delta_type:
          type: string
          enum: ["good", "bad", "neutral"]
          description: Whether the change is favourable, given the metric's direction.

    KpiSet:
      type: object
      required:
        - cost
        - runs
        - latency_p95
        - error_rate
      properties:
        cost:
          allOf: [{ $ref: "#/components/schemas/Kpi" }]
          description: Total cost in USD.
        runs:
          allOf: [{ $ref: "#/components/schemas/Kpi" }]
          description: Workflow runs (distinct traces).
        latency_p95:
          allOf: [{ $ref: "#/components/schemas/Kpi" }]
          description: p95 trace duration in ms.
        error_rate:
          allOf: [{ $ref: "#/components/schemas/Kpi" }]
          description: Fraction of traces with an error.

    CostBucket:
      type: object
      required:
        - bucket_ms
        - value
        - anomaly
      properties:
        bucket_ms:
          type: integer
          description: Bucket start, Unix epoch milliseconds.
        value:
          type: number
          minimum: 0
          description: Total cost in USD within the bucket.
        anomaly:
          type: boolean
          description: True if the bucket exceeds three times the window's median.

    ErrorBucket:
      type: object
      required:
        - bucket_ms
        - errors
        - total
      properties:
        bucket_ms:
          type: integer
          description: Bucket start, Unix epoch milliseconds.
        errors:
          type: integer
          minimum: 0
          description: Runs that errored within the bucket.
        total:
          type: integer
          minimum: 0
          description: Total runs that started within the bucket.

    TokenBucket:
      type: object
      required:
        - bucket_ms
        - input_tokens
        - output_tokens
      properties:
        bucket_ms:
          type: integer
          description: Bucket start, Unix epoch milliseconds.
        input_tokens:
          type: integer
          minimum: 0
          description: Input (prompt) tokens within the bucket.
        output_tokens:
          type: integer
          minimum: 0
          description: Output (completion) tokens within the bucket.

    LatencyBucket:
      type: object
      required:
        - bucket_ms
        - p50
        - p95
        - p99
      properties:
        bucket_ms:
          type: integer
          description: Bucket start, Unix epoch milliseconds.
        p50:
          type: number
          nullable: true
          description: >
            Median span duration in the bucket, ms. Null when no runs fell in the
            bucket (latency is undefined rather than 0).
        p95:
          type: number
          nullable: true
          description: >
            95th-percentile span duration in the bucket, ms. Null when no runs
            fell in the bucket.
        p99:
          type: number
          nullable: true
          description: >
            99th-percentile span duration in the bucket, ms. Null when no runs
            fell in the bucket.

    WorkflowCost:
      type: object
      required:
        - name
        - cost
        - calls
        - trend
      properties:
        name:
          type: string
          description: Workflow name (the trace root span name).
        cost:
          type: number
          minimum: 0
          description: Total cost in USD over the window.
        calls:
          type: integer
          minimum: 0
          description: Number of runs (traces) for this workflow.
        trend:
          type: array
          items:
            type: integer
            minimum: 0
          description: >-
            Call count per time bucket across the window, oldest first and
            zero-filled, aligned to a shared axis for the usage sparkline.

    Workflow:
      type: object
      required:
        - name
        - calls
        - cost
        - avg_latency_ms
        - error_rate
        - trend
        - last_trace_id
      properties:
        name:
          type: string
          description: Workflow name (the trace root span name).
        calls:
          type: integer
          minimum: 0
          description: Number of runs (traces) for this workflow over the window.
        cost:
          type: number
          minimum: 0
          description: Total cost in USD over the window.
        avg_latency_ms:
          type: number
          minimum: 0
          description: >-
            Mean end-to-end run duration in milliseconds. 0 for long windows
            served from the daily rollup, where per-trace durations are not
            retained.
        error_rate:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of the workflow's runs that errored (0–1).
        trend:
          type: array
          items:
            type: integer
            minimum: 0
          description: >-
            Call count per time bucket across the window, oldest first and
            zero-filled, aligned to a shared axis for the row sparkline.
        last_trace_id:
          type: string
          description: >-
            The workflow's most recent trace in the window, for deep-linking a row
            to its trace detail. Empty for long windows served from the daily
            rollup, which does not retain trace identity.

    AvailableTool:
      type: object
      required:
        - name
        - used
      properties:
        name:
          type: string
          description: Tool name as offered to the model.
        used:
          type: boolean
          description: Whether the workflow invoked this tool in the sampled run.
        description:
          type: string
          description: Human-readable description of what the tool does.

    WorkflowDetail:
      type: object
      required:
        - name
        - calls
        - cost
        - avg_latency_ms
        - p95_latency_ms
        - error_rate
        - input_tokens
        - output_tokens
        - model
        - provider
        - tools
        - last_trace_id
      properties:
        name:
          type: string
          description: Workflow name (the trace root span name).
        calls:
          type: integer
          minimum: 0
          description: Number of runs (traces) for this workflow over the window.
        cost:
          type: number
          minimum: 0
          description: Total cost in USD over the window.
        avg_latency_ms:
          type: number
          minimum: 0
          description: Mean end-to-end run duration in milliseconds.
        p95_latency_ms:
          type: number
          nullable: true
          minimum: 0
          description: >-
            p95 end-to-end run duration in milliseconds, or null when undefined
            (no runs in the window).
        error_rate:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of the workflow's runs that errored (0–1).
        input_tokens:
          type: integer
          minimum: 0
          description: Total input tokens across the workflow's runs over the window.
        output_tokens:
          type: integer
          minimum: 0
          description: Total output tokens across the workflow's runs over the window.
        model:
          type: string
          description: The workflow's most-used normalized model id over the window.
        provider:
          type: string
          description: Provider inferred from the model id; empty when unrecognised.
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AvailableTool"
          description: >-
            The workflow's tool surface, the union of available_tools from its most
            recent run. Empty when content/tool capture is disabled.
        last_trace_id:
          type: string
          description: The workflow's most recent trace in the window, for deep-linking.

    WorkflowVersion:
      type: object
      required:
        - version
        - first_seen_ms
        - last_seen_ms
        - calls
        - cost
        - cost_per_run
        - p95_latency_ms
        - error_rate
        - tokens_per_run
      properties:
        version:
          type: string
          description: The workflow version; empty for the runs that carry none.
        first_seen_ms:
          type: integer
          description: Start of the version's first run in the window (the day's start over ranges longer than 30d).
        last_seen_ms:
          type: integer
          description: Start of the version's latest run in the window (the day's start over ranges longer than 30d).
        calls:
          type: integer
          minimum: 0
          description: Number of runs (traces) of this version over the window.
        cost:
          type: number
          minimum: 0
          description: Total cost in USD of this version's runs.
        cost_per_run:
          type: number
          minimum: 0
          description: Mean cost in USD per run.
        p95_latency_ms:
          type: number
          nullable: true
          minimum: 0
          description: p95 end-to-end run duration in milliseconds; null over ranges longer than 30d.
        error_rate:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of this version's runs that errored (0–1).
        tokens_per_run:
          type: number
          minimum: 0
          description: Mean input plus output tokens per run.

    Failure:
      type: object
      required:
        - workflow
        - count
        - pct
        - top_error
      properties:
        workflow:
          type: string
          description: Workflow name (the trace root span name).
        count:
          type: integer
          minimum: 0
          description: Number of failed runs.
        pct:
          type: number
          description: Fraction of this workflow's runs that failed.
        top_error:
          type: string
          description: Most common error_type among this workflow's failed runs.

    PaginatedCostBucketResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CostBucket"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedErrorBucketResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ErrorBucket"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedTokenBucketResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TokenBucket"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedLatencyBucketResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LatencyBucket"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedWorkflowCostResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowCost"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedWorkflowResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedWorkflowVersionResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowVersion"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedFailureResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Failure"
        total:
          type: integer
          description: Total failed runs in the window (not just the listed workflows).
        page:
          type: integer
        page_size:
          type: integer

    Anomaly:
      type: object
      required:
        - metric
        - scope
        - workflow
        - bucket_ms
        - observed
        - expected
        - deviation
        - score
        - direction
        - severity
        - summary
      properties:
        metric:
          type: string
          enum: ["cost", "error_rate", "runs"]
          description: The metric that deviated.
        scope:
          type: string
          enum: ["workspace", "workflow"]
          description: Whether this anomaly is workspace-wide or for one workflow.
        workflow:
          type: string
          description: The workflow name when scope is "workflow"; empty otherwise.
        bucket_ms:
          type: integer
          description: Anomalous day bucket, Unix epoch milliseconds (UTC midnight).
        observed:
          type: number
          description: The bucket's value (USD, error rate 0–1, or run count).
        expected:
          type: number
          description: Baseline median the value was compared against.
        deviation:
          type: number
          description: observed − expected.
        score:
          type: number
          description: Signed robust z-score (0.6745·deviation/MAD); its sign matches direction.
        direction:
          type: string
          enum: ["spike", "drop"]
          description: Whether the value rose above or fell below the baseline.
        severity:
          type: string
          enum: ["info", "warning", "critical"]
          description: Magnitude band of the deviation.
        summary:
          type: string
          description: One-line human-readable description of the anomaly.

    SetupIssue:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          description: >
            Stable identifier: no_llm_spans, unpriced_model, unmetered,
            no_model, instant_llm_spans, error_without_detail, missing_root_span, unnamed_workflow, or rejected_<drop code>
            for spans the collector rejected (e.g. rejected_invalid_timestamp).
        severity:
          type: string
          enum: ["info", "warning", "critical"]
        message:
          type: string
          description: What is wrong and how to fix it.

    SetupCheck:
      allOf:
        - $ref: "#/components/schemas/SetupIssue"
        - type: object
          required: [spans, share, example_trace_id]
          properties:
            spans:
              type: integer
              description: Spans affected in the window.
            share:
              type: number
              description: spans as a fraction (0–1) of the window's stored and rejected spans.
            example_trace_id:
              type: string
              description: One affected trace; empty for rejected spans, which are not stored.

    PaginatedSetupCheckResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SetupCheck"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedAnomalyResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Anomaly"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    ModelCost:
      type: object
      required:
        - name
        - cost
        - calls
        - input_tokens
        - output_tokens
      properties:
        name:
          type: string
          description: Model id.
        cost:
          type: number
          minimum: 0
          description: Total cost in USD over the window.
        calls:
          type: integer
          minimum: 0
          description: Number of runs (traces) attributed to this model.
        input_tokens:
          type: integer
          minimum: 0
          description: Input tokens summed across the model's spans.
        output_tokens:
          type: integer
          minimum: 0
          description: Output tokens summed across the model's spans.

    UserUsage:
      type: object
      required:
        - user_id
        - cost
        - cost_prev
        - runs
        - runs_prev
        - trend
      properties:
        user_id:
          type: string
          description: The end-client/metering user (from the `user.id` attribute).
        cost:
          type: number
          minimum: 0
          description: Cost in USD over the current window.
        cost_prev:
          type: number
          minimum: 0
          description: Cost in USD over the equal-length preceding window.
        runs:
          type: integer
          minimum: 0
          description: Run (trace) count over the current window.
        runs_prev:
          type: integer
          minimum: 0
          description: Run count over the preceding window.
        trend:
          type: array
          items:
            type: number
            minimum: 0
          description: >-
            Cost per time bucket across the current window, oldest first
            and zero-filled, for the row sparkline.

    WorkflowUsage:
      type: object
      required:
        - name
        - model
        - cost
        - cost_prev
        - runs
        - runs_prev
      properties:
        name:
          type: string
          description: Workflow name (the trace root span name).
        model:
          type: string
          description: The workflow's most-used model over the window.
        cost:
          type: number
          minimum: 0
          description: Cost in USD over the current window.
        cost_prev:
          type: number
          minimum: 0
          description: Cost in USD over the equal-length preceding window.
        runs:
          type: integer
          minimum: 0
          description: Run (trace) count over the current window.
        runs_prev:
          type: integer
          minimum: 0
          description: Run count over the preceding window.

    AttributeUsage:
      type: object
      required:
        - value
        - cost
        - calls
        - runs
        - input_tokens
        - output_tokens
      properties:
        value:
          type: string
          description: One value of the grouped custom attribute.
        cost:
          type: number
          minimum: 0
          description: Total cost in USD over the window for this value.
        calls:
          type: integer
          minimum: 0
          description: Number of spans attributed to this value.
        runs:
          type: integer
          minimum: 0
          description: Number of runs (traces) attributed to this value.
        input_tokens:
          type: integer
          minimum: 0
          description: Input tokens summed across this value's spans.
        output_tokens:
          type: integer
          minimum: 0
          description: Output tokens summed across this value's spans.

    PaginatedModelCostResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelCost"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedUserUsageResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserUsage"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedWorkflowUsageResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowUsage"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedAttributeKeyResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            type: string
          description: Available custom-attribute keys.
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    PaginatedAttributeUsageResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttributeUsage"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
