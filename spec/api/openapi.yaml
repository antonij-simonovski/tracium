          minimum: 0
          description: Number of runs (traces) attributed to this value.
        input_tokens:
          type: integer
          minimum: 0
          description: Input tokens summed across this value's spans.
        output_tokens:
          type: integer
          minimum: 0
          description: Output tokens summed across this value's spans.

