    QueryRequest:
      type: object
      description: Set metrics to aggregate, or columns to list calls.
      properties:
        view:
          type: string
          enum: ["calls", "runs"]
          description: calls has one row per call (span); runs one per run (trace). Defaults to calls.
        metrics:
          type: array
          items:
            type: string
          description: >
            Metrics of the view, e.g. cost, calls, error_rate, latency_p95_ms,
            or <func>:<field>, e.g. max:cost_usd, with func one of
            metric_functions.
        dimensions:
          type: array
          maxItems: 4
          items:
            type: string
          description: >
            Fields to group by: a dimension, a column of the view, or
            attr.<key>. On the calls view also run.<field> (a runs-view field
            of the call's run, including run.attr.<key>) and parent.<column>
            (a stored column or parent.attr.<key> of the call's parent span;
            with no parent in the window, text reads empty and numbers 0, so
            filter parent_span_id not_empty to skip root calls). On the
            runs view attr.<key> is the first non-empty value among the run's
            calls.
        columns:
          type: array
          maxItems: 30
          items:
            type: string
          description: >
            Lists the matching calls or runs with these fields instead of
            aggregating; metrics, dimensions, granularity, formulas and having
            must be empty. Text longer than 2000 characters is truncated.
        filters:
          type: array
          maxItems: 10
          description: All must match; a filter with any matches when one of its filters does.
          items:
            $ref: "#/components/schemas/QueryFilter"
        formulas:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/QueryFormula"
        having:
          type: array
          maxItems: 10
          description: Keeps aggregated rows where every comparison on a metric or formula holds.
          items:
            $ref: "#/components/schemas/QueryHaving"
        granularity:
          type: string
          enum: ["hour", "day"]
        from:
          type: string
          format: date-time
          description: Defaults to 7 days before to.
        to:
          type: string
          format: date-time
          description: Defaults to now.
        order_by:
          type: string
          description: >
            A metric, a formula, a dimension, or time; when listing, one of the columns.
            Defaults to the first metric, time with a granularity, or newest
            first when listing.
        order:
          type: string
          enum: ["asc", "desc"]
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Rows per page. Defaults to 100; when listing, 50 and at most 200.
        page:
          type: integer
          minimum: 1
          description: 1-indexed. Pass meta.next_page to read the next page; pages reach at most 100000 rows deep.
        workspace_id:
          type: string
          description: Restrict to one workspace. Defaults to every readable workspace.
    QueryFilter:
      type: object
      description: Either field and op, or any.
      properties:
        any:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/QueryFilter"
          description: Filters of which at least one must match. They do not nest.
        field:
          type: string
        op:
          type: string
          enum: ["eq", "neq", "contains", "in", "not_in", "gt", "ge", "lt", "le", "is_empty", "not_empty"]
          description: gt, ge, lt and le need a numeric field; is_empty and not_empty take no value.
        value:
          oneOf:
            - type: string
            - type: number
          description: For eq, neq, contains, gt, ge, lt and le.
        values:
          type: array
          maxItems: 100
          items:
            type: string
          description: For in and not_in.
    QueryFormula:
      type: object
      required: [name, expr]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$"
          description: The result column; must not repeat a metric or dimension.
        expr:
          type: string
          maxLength: 500
          description: >
            Arithmetic over the query's metrics and numbers with + - * / and
            parentheses, e.g. cost / runs. Division by zero gives 0.
    QueryHaving:
      type: object
      required: [field, op, value]
      properties:
        field:
          type: string
          description: One of the query's metrics or formulas.
        op:
          type: string
          enum: ["eq", "neq", "gt", "ge", "lt", "le"]
        value:
          oneOf:
            - type: string
            - type: number
    QueryResult:
      type: object
      required: [columns, rows, meta]
      properties:
        columns:
          type: array
          items:
            type: string
          description: The listed columns; or dimensions, then time (with a granularity), then metrics, then formulas.
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Keyed by column. Dimensions and text columns are strings, time is RFC 3339, metrics and numeric columns are numbers.
        meta:
          $ref: "#/components/schemas/QueryMeta"
    QueryMeta:
      type: object
      required: [view, from, to, truncated, page]
      properties:
        view:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        granularity:
          type: string
        cost_source:
          type: string
          enum: ["reconciled", "spans"]
          description: >
            reconciled matches the dashboard's cost KPI; spans counts span cost
            only, used when grouping or filtering by a dimension usage metrics
            do not carry.
        truncated:
          type: boolean
          description: More rows matched than the limit.
        page:
          type: integer
        next_page:
          type: integer
          description: Set when more rows match; pass it as page to read them.
    QuerySchema:
      type: object
      required: [views, metric_functions, filter_ops, having_ops, granularities, attribute_keys, workflows, models, max_window_days, max_limit, max_row_limit]
      properties:
        views:
          type: array
          items:
            $ref: "#/components/schemas/QueryView"
        metric_functions:
          type: array
          items:
            type: string
          description: Functions that build a metric from any field as <func>:<field>.
        filter_ops:
          type: array
          items:
            type: string
        having_ops:
          type: array
          items:
            type: string
        granularities:
          type: array
          items:
            type: string
        attribute_keys:
          type: array
          items:
            type: string
        workflows:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            type: string
        max_window_days:
          type: integer
        max_limit:
          type: integer
        max_row_limit:
          type: integer
    QueryView:
      type: object
      required: [name, description, dimensions, metrics, columns, related]
      properties:
        name:
          type: string
        description:
          type: string
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/QueryField"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/QueryField"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/QueryColumn"
          description: >
            Fields beside the dimensions: per-run totals on runs, stored
            columns read live from the database on calls.
        related:
          type: array
          items:
            $ref: "#/components/schemas/QueryField"
          description: Prefixed fields that read related rows, such as run.<field> and parent.<column>.
    QueryColumn:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: ["number", "text"]
        description:
          type: string
    QueryField:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
