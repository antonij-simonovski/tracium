# OTel GenAI SIG attributes consumed by Tracium.
# These are the standard gen_ai.* semantic conventions that Tracium reads
# from incoming OTLP spans to populate the canonical Span schema.
# Reference: https://opentelemetry.io/docs/specs/semconv/gen-ai/
#
# Only the attributes listed here feed pricing, span kind and workflow naming.
# Any other attribute outside the gen_ai.*, tracium.*, llm.* and traceloop.*
# namespaces is stored as a custom allocation label and never changes cost.
# Setup guide: https://docs.tracium.ai/#otel-setup

attributes:
  - name: gen_ai.request.model
    description: >
      The model name requested by the caller (e.g. "gpt-4o", "claude-sonnet-4-6").
      Falls back to gen_ai.response.model when absent.
    type: string
    required: true

  - name: gen_ai.response.model
    description: The model that served the request. Used when gen_ai.request.model is absent.
    type: string
    required: false

  - name: gen_ai.agent.name
    description: >
      Preferred workflow name for the span, ahead of Traceloop names and
      service.name. Set it on a run's root span when one service runs several
      workflows.
    type: string
    required: false

  - name: gen_ai.usage.input_tokens
    description: >
      Input (prompt) tokens for the whole prompt, cached tokens included. Also
      read from gen_ai.usage.prompt_tokens and llm.usage.prompt_tokens. When the
      cache tokens below exceed this value, it is read as the uncached share
      instead.
    type: integer
    required: false

  - name: gen_ai.usage.output_tokens
    description: >
      Number of output (completion) tokens generated by the model response. Also
      read from gen_ai.usage.completion_tokens and llm.usage.completion_tokens.
    type: integer
    required: false

  - name: gen_ai.usage.cache_read.input_tokens
    description: >
      Input tokens served from the provider's prompt cache, priced at the
      model's cache-read rate. Also read from gen_ai.usage.cache_read_input_tokens.
    type: integer
    required: false

  - name: gen_ai.usage.cache_creation.input_tokens
    description: >
      Input tokens written to the provider's prompt cache, priced at the model's
      cache-write rate. Also read from gen_ai.usage.cache_creation_input_tokens.
    type: integer
    required: false

  - name: gen_ai.usage.total_tokens
    description: >
      Total tokens. Used only to derive missing output tokens. Also read from
      llm.usage.total_tokens.
    type: integer
    required: false

  - name: gen_ai.response.finish_reasons
    description: >
      Why the model stopped generating tokens; the first entry is stored.
      Common values: "stop" (natural completion), "length" (token limit),
      "tool_calls" (model called a tool), "content_filter" (filtered by safety
      policy). A scalar string is also accepted.
    type: string[]
    required: false

  - name: gen_ai.operation.name
    description: >
      The operation the span represents. Read by the collector to derive the
      normalized Span.kind. Common values: "chat" / "text_completion" /
      "generate_content" (→ llm), "embeddings" (→ embedding), "execute_tool"
      (→ tool), "create_agent" / "invoke_agent" (→ agent).
    type: string
    required: false

  # Opt-in content capture. These carry raw prompt/completion text and may
  # contain sensitive data, so the collector only persists them when
  # capture_content is enabled (default off). The collector reads BOTH the
  # current OTel structured form and OpenLLMetry's legacy indexed form, then
  # flattens each side into Span.input / Span.output.

  # --- Current OTel GenAI form (semconv v1.38+) ---
  - name: gen_ai.input.messages
    description: >
      JSON array of input messages, e.g.
      [{"role":"user","parts":[{"type":"text","content":"..."}]}].
      Flattened into Span.input. Captured only with content capture enabled.
    type: string
    required: false

  - name: gen_ai.output.messages
    description: JSON array of output messages (one per generation). Flattened into Span.output.
    type: string
    required: false

  - name: gen_ai.system_instructions
    description: System instructions / system prompt. Prepended to Span.input when present.
    type: string
    required: false

  - name: gen_ai.tool.definitions
    description: JSON array of tool definitions offered to the model. Source for tracium.available_tools; takes precedence over llm.request.functions.{i}.*.
    type: string
    required: false

  # --- OpenLLMetry (Traceloop) legacy indexed form, read for compatibility ---
  # gen_ai.prompt.{i}.role / gen_ai.prompt.{i}.content      → Span.input
  # gen_ai.completion.{i}.role / gen_ai.completion.{i}.content → Span.output
  # llm.request.functions.{i}.name / .description           → tracium.available_tools
  - name: gen_ai.prompt.{i}.content
    description: OpenLLMetry indexed prompt-message content. Flattened into Span.input. Deprecated upstream in favour of gen_ai.input.messages.
    type: string
    required: false

  - name: gen_ai.completion.{i}.content
    description: OpenLLMetry indexed completion-message content. Flattened into Span.output. Deprecated upstream in favour of gen_ai.output.messages.
    type: string
    required: false

  - name: llm.request.functions.{i}.name
    description: OpenLLMetry tool/function definition name offered to the model. Source for tracium.available_tools.
    type: string
    required: false

  - name: llm.request.functions.{i}.description
    description: OpenLLMetry tool/function definition description. Source for tracium.available_tools.
    type: string
    required: false
