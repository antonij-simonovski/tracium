# Tracium collector runtime configuration (OpenTelemetry Collector format).
#
# This replaces the old bespoke config.yaml. The receiver, batch, queue, retry,
# and health-check behaviour are now standard OTel Collector features; only the
# `tracium` processor and `clickhousespan` exporter are Tracium-specific.
#
# Override values via env vars using ${ENV:VAR} expansion (built into the
# collector). Run with:  ./tracium-collector --config config/collector.yaml

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:GRPC_ADDR:-0.0.0.0:4317}
        # Ingest requires a per-workspace API key on every request. This is not
        # optional: the traciumauth authenticator (see extensions) verifies the
        # key and rejects anything unknown or revoked with 401.
        auth: { authenticator: traciumauth }
      http:
        endpoint: ${env:HTTP_ADDR:-0.0.0.0:4318}
        # Ingest requires a per-workspace API key on every request. See the gRPC
        # note above; the same authenticator guards both protocols.
        auth: { authenticator: traciumauth }

processors:
  # Tracium LLM-span enrichment.
  tracium:
    pricing:
      source: static
      static_file_path: ${env:PRICING_STATIC_PATH:-/etc/tracium/pricing.json}
    user:
      source: passthrough
    # Persists raw prompt/completion text; set CAPTURE_CONTENT=false to drop it.
    capture_content: ${env:CAPTURE_CONTENT:-true}
    # Count rejected spans per workspace for the dashboard's setup checks.
    dead_letter:
      clickhouse_dsn: ${env:CLICKHOUSE_DSN}
    # allowed_models: [gpt-4o, claude-3-5-sonnet]   # empty = allow all

  # NOTE: there is deliberately no standalone `batch` processor here. A batch
  # processor sits BEFORE the exporter's persistent queue: it buffers spans in
  # memory and returns success to the receiver (HTTP 200) the moment they are
  # buffered, so a crash or a full queue silently drops spans the client was
  # already told were stored. Batching now happens INSIDE the exporter, after the
  # durable queue (see exporters.clickhousespan.batcher), so acknowledgement lines
  # up with a durable on-disk write.

exporters:
  clickhousespan:
    dsn: ${env:CLICKHOUSE_DSN}
    sending_queue:
      # storage points the queue at the file_storage extension below, so it
      # survives a process restart. Without it the queue is memory-only and any
      # restart during a ClickHouse outage — rolling update, OOM kill, redeploy,
      # node drain — destroys spans the client was already told (HTTP 200) were
      # delivered. OTLP cannot un-acknowledge, so the sender has discarded them.
      storage: file_storage
      # queue_size is in BATCHES, not spans. Upstream's default of 1000 is
      # 1000 x send_batch_size(5000) = 5M spans; at ~2 KB/span (more with
      # capture_content on) that is ~10 GB. Sized here for a ~2 GB ceiling:
      #   200 batches x 5000 spans x ~2 KB = ~2 GB.
      # With storage set this is bounded by DISK, not RAM, so it no longer
      # inflates the collector toward an OOM the way the in-memory default did.
      queue_size: ${env:QUEUE_SIZE:-200}
    retry_on_failure:
      enabled: true
      # 0 = retry indefinitely. The upstream default of 5m drops batches
      # permanently across any longer outage, and a ClickHouse upgrade routinely
      # exceeds 5 minutes. Indefinite retry is only safe because the queue above
      # is durable and bounded — the two settings go together.
      max_elapsed_time: ${env:RETRY_MAX_ELAPSED:-0}
    batcher:
      # Batches on the way OUT of the durable queue toward ClickHouse (fewer
      # parts to merge), so it never sits between the receiver and durability.
      # Every OTLP request is persisted to the queue before it is acknowledged;
      # this only controls how persisted spans are grouped when flushed.
      # Flush at 5k spans or 5s, whichever first; split anything over 10k.
      enabled: true
      flush_timeout: 5s
      min_size_items: ${env:BATCH_MIN_SIZE:-5000}
      max_size_items: ${env:BATCH_MAX_SIZE:-10000}
  # Uncomment for local dev without ClickHouse:
  # debug:
  #   verbosity: detailed

extensions:
  health_check:
    endpoint: ${env:HEALTH_ADDR:-0.0.0.0:8080}
  # Backs sending_queue.storage above. The directory MUST be a persistent
  # volume: a path that lives only inside the container is wiped on restart,
  # which defeats the whole point of a durable queue.
  file_storage:
    directory: ${env:QUEUE_STORAGE_DIR:-/var/lib/tracium/queue}
    # The queue is the collector's memory of un-flushed spans; reclaiming it on
    # a timer would silently discard telemetry, so compaction only defragments.
    compaction:
      on_start: true
      directory: ${env:QUEUE_STORAGE_DIR:-/var/lib/tracium/queue}
  # REQUIRED ingest authentication — per-workspace API keys. Every OTLP request
  # must carry a Tracium API key (issued from the dashboard / POST
  # /v1/workspaces/{id}/api-keys); the authenticator resolves it to that key's
  # workspace and rejects unknown or revoked keys with 401. There is no keyless
  # ingest: the key both authenticates the sender and decides which workspace the
  # telemetry lands in, so senders set only the key and no workspace attribute:
  #   OTEL_EXPORTER_OTLP_HEADERS="Authorization=Bearer <api-key>"
  # The extension holds no keys itself; it verifies each against the API, which
  # owns the key store. INGEST_VERIFY_URL must point at that API.
  traciumauth:
    endpoint: ${env:INGEST_VERIFY_URL:-http://api:8090/v1/ingest/keys/verify}
    # cache_ttl bounds how long a revoked key keeps working; keep it short.
    cache_ttl: 60s
    # Upper bound on cached verifications (LRU). Caps memory regardless of how
    # many distinct keys arrive. Defaults to 10000.
    cache_max_entries: 10000
    # Per-sender cap on verification calls forced against the API within
    # sender_verify_window. Only cache misses count, so one valid key is charged
    # once and then served from cache — legitimate high-volume ingest is
    # unaffected. Stops one abusive sender streaming invalid keys from spending
    # the collector's shared verify budget. Default 20; <= 0 disables.
    sender_verify_limit: 20
    sender_verify_window: 1m

service:
  # traciumauth is required here: without it the receivers have no authenticator
  # and the tracium processor rejects every (now keyless) span as unauthenticated.
  extensions: [health_check, file_storage, traciumauth]
  telemetry:
    metrics:
      # Bound to all interfaces so the collector's own metrics — including the
      # span-drop counters the tracium processor emits — are scrapable from
      # outside the container. localhost would make drops invisible in practice.
      address: ${env:TELEMETRY_ADDR:-0.0.0.0:8888}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tracium]
      exporters: [clickhousespan]
    # Metrics path: OpenLLMetry's gen_ai.client.token.usage points are priced by
    # the tracium processor and written as source="metric" rows into the same
    # tracium.spans table the traces path uses. Disabling this pipeline (or
    # simply receiving no metrics) leaves the system span-only — no metric rows
    # are written and all dashboard numbers fall back to spans.
    metrics:
      receivers: [otlp]
      processors: [tracium]
      exporters: [clickhousespan]
