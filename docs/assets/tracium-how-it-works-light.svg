<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-label="Your app sends OTLP with an API key to the Tracium collector, which prices and tags each call and writes to ClickHouse; the dashboard reads it through the API. Everything runs on your infrastructure." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6863"/></marker></defs><rect x="250" y="16" width="700" height="238" rx="14" fill="none" stroke="#0e9f6e" stroke-dasharray="6 5" stroke-width="1.5"/><text x="270" y="44" font-size="11" font-weight="600" letter-spacing="1.2" fill="#0e9f6e">YOUR INFRASTRUCTURE</text><text x="930" y="44" font-size="11" text-anchor="end" fill="#5b6863">one docker compose up · data never leaves</text><rect x="10" y="70" width="180" height="160" rx="10" fill="#ffffff" stroke="#dfe5e2"/><text x="28" y="100" font-size="15" font-weight="600" fill="#0f1714">Your app</text><text x="28" y="126" font-size="12" fill="#5b6863">OpenLLMetry</text><text x="28" y="148" font-size="12" fill="#5b6863">OTel GenAI instrumentation</text><text x="28" y="170" font-size="12" fill="#5b6863">Your own gen_ai.* spans</text><text x="28" y="206" font-size="12" font-weight="600" fill="#0e9f6e">No Tracium SDK</text><line x1="190" y1="150" x2="264" y2="150" stroke="#5b6863" stroke-width="1.5" marker-end="url(#ah)"/><text x="218" y="141" font-size="11" text-anchor="middle" fill="#5b6863">OTLP</text><text x="218" y="168" font-size="11" text-anchor="middle" fill="#5b6863">+ API key</text><rect x="270" y="70" width="190" height="160" rx="10" fill="#ffffff" stroke="#dfe5e2"/><text x="288" y="100" font-size="15" font-weight="600" fill="#0f1714">Collector</text><text x="288" y="126" font-size="12" fill="#5b6863">prices every call</text><text x="288" y="148" font-size="12" fill="#5b6863">tags model, workflow,</text><text x="288" y="166" font-size="12" fill="#5b6863">client and version</text><text x="288" y="188" font-size="12" fill="#5b6863">rejects unkeyed spans</text><line x1="460" y1="115" x2="494" y2="115" stroke="#5b6863" stroke-width="1.5" marker-end="url(#ah)"/><text x="480.0" y="106" font-size="11" text-anchor="middle" fill="#5b6863">writes</text><rect x="500" y="70" width="180" height="90" rx="10" fill="#ffffff" stroke="#dfe5e2"/><text x="518" y="100" font-size="15" font-weight="600" fill="#0f1714">ClickHouse</text><text x="518" y="126" font-size="12" fill="#5b6863">spans + daily rollups</text><text x="518" y="146" font-size="12" fill="#5b6863">fast at any volume</text><rect x="500" y="172" width="180" height="58" rx="10" fill="#ffffff" stroke="#dfe5e2"/><text x="518" y="202" font-size="15" font-weight="600" fill="#0f1714">Postgres</text><text x="518" y="220" font-size="12" fill="#5b6863">accounts and keys</text><line x1="680" y1="150" x2="714" y2="150" stroke="#5b6863" stroke-width="1.5" marker-end="url(#ah)"/><text x="700.0" y="141" font-size="11" text-anchor="middle" fill="#5b6863">API</text><rect x="720" y="70" width="210" height="160" rx="10" fill="#ffffff" stroke="#dfe5e2"/><text x="738" y="100" font-size="15" font-weight="600" fill="#0f1714">Dashboard</text><text x="738" y="126" font-size="12" fill="#5b6863">Overview and anomalies</text><text x="738" y="148" font-size="12" fill="#5b6863">Traces</text><text x="738" y="170" font-size="12" fill="#5b6863">Workflows and versions</text><text x="738" y="192" font-size="12" fill="#5b6863">Usage and clients</text></svg>
